name: RedCyberFox CI

on:
  push:
    branches: [ main, "fix/*", "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Check Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v ./...

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
        
      - name: npm install and build
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Verify Docker Compose config
        run: docker compose -f deployments/dev/docker-compose.yml config
