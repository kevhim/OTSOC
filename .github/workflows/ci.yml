name: RedCyberFox CI

on:
  push:
    branches: [ main, "fix/*", "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: development_password
          POSTGRES_DB: redcyberfox
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Check Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (Unit/Integration)
        run: go test -v -skip=TestMigrations ./...

      - name: Go Test (Migration)
        run: go test -v -run=TestMigrations ./server
        env:
          DATABASE_URL: "postgres://root:development_password@localhost:5433/redcyberfox?sslmode=disable"

      - name: Apply DB Migrations
        run: |
          for f in server/migrations/*.sql; do
            psql "postgres://root:development_password@localhost:5433/redcyberfox?sslmode=disable" -f "$f"
          done

      - name: Start API & Worker for E2E
        run: |
          go build -o api.exe ./server/cmd/api
          go build -o worker.exe ./server/cmd/worker
          ./api.exe &
          ./worker.exe &
          
          # Bounded readiness loop for API
          timeout=10
          for i in $(seq 1 $timeout); do
            # We just need to get any HTTP response that isn't connection refused to prove it's up.
            # The API returns 400 for 'test' tenant because of invalid format, but that's a valid HTTP response from the API.
            # Let's use 400 or 200 as success.
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/v1/events?tenant_id=test || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "400" ]; then
              echo "API is ready (HTTP $code)"
              exit 0
            fi
            echo "Waiting for API... ($i/$timeout)"
            sleep 1
          done
          echo "API failed to start within $timeout seconds"
          exit 1
        env:
          DATABASE_URL: "postgres://root:development_password@localhost:5433/redcyberfox?sslmode=disable"
          VALKEY_ADDR: "localhost:6379"

      - name: Go Test (E2E)
        run: go test -v -tags=e2e ./server
        env:
          DATABASE_URL: "postgres://root:development_password@localhost:5433/redcyberfox?sslmode=disable"
          VALKEY_ADDR: "localhost:6379"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
        
      - name: npm install and build
        run: |
          cd dashboard
          rm -f package-lock.json
          npm install
          npm install @oxlint/binding-linux-x64-gnu --no-save
          npm run lint
          npm run build

      - name: Verify Docker Compose config
        run: docker compose -f deployments/dev/docker-compose.yml config
