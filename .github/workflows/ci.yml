name: RedCyberFox CI

on:
  push:
    branches: [ main, "fix/*", "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: development_password
          POSTGRES_DB: redcyberfox
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:latest
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.x'

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Check Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (Unit)
        run: go test -v ./...

      - name: Start API & Worker for E2E
        run: |
          go build -o api.exe ./server/cmd/api
          go build -o worker.exe ./server/cmd/worker
          ./api.exe &
          ./worker.exe &
          sleep 2
        env:
          DATABASE_URL: "postgres://root:development_password@localhost:5433/redcyberfox?sslmode=disable"
          VALKEY_ADDR: "localhost:6379"

      - name: Go Test (E2E)
        run: go test -v -tags=e2e ./server
        env:
          DATABASE_URL: "postgres://root:development_password@localhost:5433/redcyberfox?sslmode=disable"
          VALKEY_ADDR: "localhost:6379"

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
        
      - name: npm install and build
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Verify Docker Compose config
        run: docker compose -f deployments/dev/docker-compose.yml config
