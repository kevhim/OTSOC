
services:
  postgres:
    image: postgres:16-alpine
    container_name: redcyberfox_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: redcyberfox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d redcyberfox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7.2
    container_name: redcyberfox_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
